   name: Cleanup job
   on:
     schedule:
       - cron: '0 3 * * *'
     workflow_dispatch:
   jobs:
     cleanup:
       runs-on: ubuntu-latest
       steps:
         - name: Chiama endpoint di pulizia
           run: |
             curl -f -X POST --max-time 180 \
               -H "x-job-token: ${{ secrets.JOB_TOKEN }}" \
               "${{ secrets.APP_URL }}/api/jobs/cleanup?days=30"